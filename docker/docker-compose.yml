# Local dev. `docker compose -f docker/docker-compose.yml up -d redis postgres` for just
# the datastores (run the API from VS Code), or `up -d --build` for everything.
services:
  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    volumes:
      - redis-data:/data
    command: redis-server --save 60 1

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fraud
      POSTGRES_PASSWORD: fraud
      POSTGRES_DB: fraud
    ports:
      - "5433:5432"   # host port 5433 so it can't clash with a Postgres you already run
    volumes:
      - pg-data:/var/lib/postgresql/data
      # schema is applied automatically the first time the volume is created
      - ../src/monitoring/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fraud -d fraud"]
      interval: 3s
      timeout: 3s
      retries: 20

  api:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    ports:
      - "8000:8000"
    environment:
      OMP_NUM_THREADS: "1"
      WEB_CONCURRENCY: "4"
      REDIS_URL: redis://redis:6379/0
      DATABASE_URL: postgresql://fraud:fraud@postgres:5432/fraud
      MODEL_PATH: /models/phase2_lgbm.pkl
    volumes:
      - ../models:/models:ro
    depends_on:
      redis:
        condition: service_started
      postgres:
        condition: service_healthy

volumes:
  redis-data:
  pg-data:
