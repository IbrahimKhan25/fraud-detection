# Tests and an image build on every push and pull request.
# No data or model is needed: IEEE-CIS is not in the repo, so the real-data
# parity tests skip here and the synthetic parity test covers that path.
name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

# A new push to the same branch cancels the run still going for the old one.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      # Lets tests/test_monitoring.py::test_postgres_end_to_end run instead of skip.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: fraud
          POSTGRES_PASSWORD: fraud
          POSTGRES_DB: fraud
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U fraud -d fraud"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 20
    env:
      TEST_DATABASE_URL: postgresql://fraud:fraud@localhost:5432/fraud
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-serving.txt
      - run: pip install -r requirements.txt
      - run: python -m pytest tests -q -rs

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          tags: fraud-api:ci
          load: true
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max
      # The model loads at startup, not on import, so this runs without one. It
      # catches a module the Dockerfile forgot to copy or a missing serving dependency.
      - name: Import the app inside the image
        run: docker run --rm fraud-api:ci python -c "import src.serving.app"
